name: Daily AI GPU Rental Price Tracker

on:
  schedule:
    # 매일 UTC 22:00 (한국시간 KST 오전 07:00) 실행
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-gpu-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GPU Price Collector & Briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit and push updated data & reports
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ reports/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily GPU rental prices ($(date -u +'%Y-%m-%d'))"
            git push
          fi
